# ===========================
# Application Configuration
# ===========================
spring.application.name=github-action-manager
execution.workspace.base-dir=${java.io.tmpdir}/ci-workspaces

# ===========================
# Server Configuration
# ===========================
server.port=8080
server.servlet.context-path=/

# ===========================
# Database Configuration
# ===========================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ===========================
# CORS Configuration
# ===========================
# CORS is configured via CorsConfig.java
# Update the allowed origins in CorsConfig.java for your domains

spring.web.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.exposed-headers=Authorization,Content-Type,X-Total-Count,X-Page-Number,X-Page-Size
spring.web.cors.allow-credentials=true
spring.web.cors.max-age=3600

# ===========================
# Logging Configuration
# ===========================
logging.level.root=INFO
logging.level.com.example.myGithubAction=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=INFO

# ===========================
# JWT Configuration
# ===========================
# ⚠️ SECURITY: jwt.secret MUST be at least 64 characters (512 bits) for HS512
# Development: Provided in application-dev.properties (64+ chars)
# Production: Set via environment variable: export JWT_SECRET="your-very-long-secure-secret-here"
#
# To generate a secure secret:
# java -jar -cp jjwt-jackson-0.12.3.jar io.jsonwebtoken.security.Keys generateSecureSecretKey
#
# Default values (override in environment-specific files)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# ===========================
# Actuator Configuration
# ===========================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ===========================
# OpenAPI/Swagger Configuration
# ===========================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=list
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.display-request-duration=true
springdoc.show-actuator=false

