# ===========================
# Test Configuration - H2 In-Memory Database
# ===========================
spring.application.name=github-action-manager-test

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable dotenv for tests
spring.dotenv.enabled=false

# JWT - test values
jwt.secret=test-secret-key-this-must-be-at-least-64-chars-long-for-hs512-alg-testing
jwt.expiration=86400000

# SQL init - skip for H2 (tables created by JPA)
spring.sql.init.mode=never

# Logging
logging.level.root=WARN
logging.level.com.example.myGithubAction=DEBUG